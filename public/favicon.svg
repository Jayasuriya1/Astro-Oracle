<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)" />

  <!-- Celestial Zodiac Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- 8-Pointed Celestial Star Rays -->
  <g stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="70" x2="256" y2="442" />
    <line x1="70" y1="256" x2="442" y2="256" />
    <line x1="125" y1="125" x2="387" y2="387" stroke-width="3.5" stroke-opacity="0.7" />
    <line x1="387" y1="125" x2="125" y2="387" stroke-width="3.5" stroke-opacity="0.7" />
  </g>

  <!-- Mystic Crescent Moon -->
  <path d="M 275 140 A 115 115 0 1 0 372 237 A 95 95 0 1 1 275 140 Z" fill="url(#goldGrad)" />

  <!-- Inner Sparkle Star -->
  <path d="M 256 186 Q 256 256 186 256 Q 256 256 256 326 Q 256 256 326 256 Q 256 256 256 186 Z" fill="url(#purpleGrad)" />
  <circle cx="256" cy="256" r="12" fill="#fff" />
</svg>